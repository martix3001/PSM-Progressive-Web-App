<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Company Card</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    #app {
      border: 1px solid #000;
      padding: 20px;
      background-color: #fff;
      width: 300px;
      text-align: center;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
    strong {
      font-size: 1.5em;
      display: block;
      margin-bottom: 10px;
    }
    p {
      margin: 5px 0;
    }
    a {
      color: #007bff;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    .btn-back {
    background-color: #007bff;
    color: white;
    border: none;
    padding: 10px 15px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 1em;
  }
  .btn-back:hover {
    background-color: #0056b3;
  }
  </style>
</head>
<body>
  <div id="app">
    <p><strong>{{ name.toUpperCase() }}</strong></p>
    <p>ul. {{ street }}</p>
    <p>{{ postalCode }} {{ city }}</p>
    <p>tel. {{ phone1 }}</p>
    <p><a :href="website" target="_blank">{{ website }}</a></p>
  </div>

  <script src="https://unpkg.com/vue@3"></script>
  <script>
    Vue.createApp({
      data() {
        return {
          name: "UEK Kraków",
          street: "Rakowicka 27",
          postalCode: "31-510",
          city: "Kraków",
          phone1: "12 293 57 00",
          website: "https://uek.krakow.pl/"
        }
      }
    }).mount('#app');
  </script>
  <p>
    <button onclick="location.href='index.html'" class="btn-back">← Powrót na stronę główną</button>
  </p>

</body>
</html>
