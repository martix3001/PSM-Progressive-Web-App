<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>To-Do List</title>
  <style>
    body {
      font-family: 'Georgia', serif;
      background-color: #f1f8e9;
      color: #33691e;
      padding: 20px;
    }
    h2 {
      color: #558b2f;
    }
    ol {
      background: #fff;
      padding: 15px;
      border-radius: 5px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }
    li {
      margin-bottom: 10px;
      margin-left:10px;
      font-size: 1.1em;
    }
    .btn-back {
    background-color: #007bff;
    color: white;
    border: none;
    padding: 10px 15px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 1em;
  }
  .btn-back:hover {
    background-color: #0056b3;
  }
  </style>
</head>
<body>
  <div id="app">
    <h2>DO WYKONANIA</h2>
    <ol>
      <li v-for="item in tasks">{{ item }}</li>
    </ol>
  </div>

  <script src="https://unpkg.com/vue@3"></script>
  <script>
    Vue.createApp({
      data() {
        return {
          tasks: [
            "Purchase two tickets to cinema",
            "Buy groceries",
            "Finish Vue project",
            "Call mom"
          ]
        }
      }
    }).mount('#app');
  </script>
  <p>
    <button onclick="location.href='index.html'" class="btn-back">← Powrót na stronę główną</button>
  </p>

</body>
</html>
