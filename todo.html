<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>To-Do List</title>
</head>
<body>
  <div id="app">
    <h2>DO WYKONANIA</h2>
    <ol>
      <li v-for="item in tasks">{{ item }}</li>
    </ol>
  </div>

  <script src="https://unpkg.com/vue@3"></script>
  <script>
    Vue.createApp({
      data() {
        return {
          tasks: [
            "Purchase two tickets to cinema",
            "Buy groceries",
            "Finish Vue project",
            "Call mom"
          ]
        }
      }
    }).mount('#app');
  </script>
</body>
</html>
