<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Strona Główna</title>
  <style>
    .button-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 400px;
      margin: 0 auto;
      padding: 20px;
    }
    .btn {
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1em;
      text-align: center;
    }
    .btn:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>
  <h1>Zadania Vue.js</h1>
  <div class="button-container">
    <button onclick="location.href='product.html'" class="btn">Zadanie 1 – Paragon produktu</button>
    <button onclick="location.href='company.html'" class="btn">Zadanie 2 – Wizytówka firmy</button>
    <button onclick="location.href='todo.html'" class="btn">Zadanie 3 – Lista To-Do</button>
    <button onclick="location.href='counter.html'" class="btn">Zadanie 4 – Licznik kliknięć</button>
    <button onclick="location.href='book.html'" class="btn">Zadanie 5 – Formularz książki (log do konsoli)</button>
    <button onclick="location.href='bmi.html'" class="btn">Zadanie 6 – Kalkulator BMI</button>
  </div>
</body>
</html>
