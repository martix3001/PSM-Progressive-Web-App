<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>BMI Calculator</title>
  <style>
    body {
      font-family: 'Verdana', sans-serif;
      background-color: #e3f2fd;
      color: #0d47a1;
      padding: 20px;
    }
    h2 {
      color: #1565c0;
    }
    label {
      display: block;
      margin-bottom: 10px;
    }
    input {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #90caf9;
      border-radius: 4px;
    }
    p {
      font-size: 1.2em;
      margin-top: 15px;
    }
    strong {
      color: #0d47a1;
    }
    .btn-back {
    background-color: #007bff;
    color: white;
    border: none;
    padding: 10px 15px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 1em;
  }
  .btn-back:hover {
    background-color: #0056b3;
  }
  </style>
</head>
<body>
  <div id="app">
    <h2>Kalkulator BMI</h2>
    <label>
      Wzrost (cm):
      <input type="number" v-model.number="height">
    </label>
    <br>
    <label>
      Masa ciała (kg):
      <input type="number" v-model.number="weight">
    </label>
    <br><br>
    <p>BMI: <strong>{{ bmi }}</strong></p>
  </div>

  <script src="https://unpkg.com/vue@3"></script>
  <script>
    Vue.createApp({
      data() {
        return {
          height: 0,
          weight: 0
        };
      },
      computed: {
        bmi() {
          if (this.height > 0 && this.weight > 0) {
            const heightInMeters = this.height / 100;
            return (this.weight / (heightInMeters ** 2)).toFixed(2);
          }
          return "Brak danych";
        }
      }
    }).mount('#app');
  </script>
  <p>
    <button onclick="location.href='index.html'" class="btn-back">← Powrót na stronę główną</button>
  </p>

</body>
</html>
