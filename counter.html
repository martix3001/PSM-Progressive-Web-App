<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Counter</title>
</head>
<body>
  <div id="app">
    <button @click="count++">
      Kliknięcia: {{ count }}
    </button>
  </div>

  <script src="https://unpkg.com/vue@3"></script>
  <script>
    Vue.createApp({
      data() {
        return {
          count: 0
        }
      }
    }).mount('#app');
  </script>
</body>
</html>
