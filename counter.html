<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Counter</title>
  <style>
    body {
      font-family: 'Tahoma', sans-serif;
      background-color: #fbe9e7;
      color: #d84315;
      text-align: center;
      padding: 50px;
    }
    button {
      background-color: #ff5722;
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 1.5em;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #e64a19;
    }
    .btn-back {
    background-color: #007bff;
    color: white;
    border: none;
    padding: 10px 15px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 1em;
  }
  .btn-back:hover {
    background-color: #0056b3;
  }
  </style>
</head>
<body>
  <div id="app">
    <button @click="count++">
      Kliknięcia: {{ count }}
    </button>
  </div>

  <script src="https://unpkg.com/vue@3"></script>
  <script>
    Vue.createApp({
      data() {
        return {
          count: 0
        }
      }
    }).mount('#app');
  </script>
  <p>
    <button onclick="location.href='index.html'" class="btn-back">← Powrót na stronę główną</button>
  </p>

</body>
</html>
